# Nginx đứng trước 2 bản máy chủ. Docker DNS trả về IP của cả 2 bản cho tên "server";
# "resolve" bắt Nginx hỏi lại DNS định kỳ (Nginx ≥ 1.27.3), nên dùng đủ các bản và vẫn đúng khi một bản khởi động lại đổi IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream market {
    zone market 64k;
    server server:8080 resolve;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # Khi chạy thật thêm khối listen 443 ssl + chứng chỉ Let's Encrypt (certbot) và chuyển hướng 80 → 443.

    location /ws {
        proxy_pass http://market;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;   # giữ cả cổng, máy chủ so khớp với Origin khi nâng cấp WebSocket
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;   # lớn hơn chu kỳ ping 25 s của máy chủ
        proxy_buffering off;
    }

    location / {
        proxy_pass http://market;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;   # giữ cả cổng, máy chủ so khớp với Origin khi nâng cấp WebSocket
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Upstream $upstream_addr always;   # cho biết bản máy chủ nào đã trả lời
        gzip on;
        gzip_types application/json text/css application/javascript;
    }
}
