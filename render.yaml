# Render Blueprint: New → Blueprint → chọn repo này.
# Gói free không có MySQL nên bản online dùng SQLite (tạo lại khi khởi động); MySQL chạy trong CI và Docker Compose.
# Gói free chỉ một tiến trình nên bộ sinh giá chạy chung với máy chủ (FEED_EMBEDDED=1).
services:
  - type: web
    name: market-stream-go
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: FEED_EMBEDDED
        value: "1"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: market-stream-redis
          property: connectionString
  - type: keyvalue
    name: market-stream-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
